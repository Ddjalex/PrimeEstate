version: "3.9"
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: secure_suite
    volumes:
      - mongo_data:/data/db

  backend:
    build: ../backend
    command: ["go", "run", "."]
    working_dir: /app
    ports:
      - "8081:8081"
    depends_on:
      - mongo

volumes:
  mongo_data:
